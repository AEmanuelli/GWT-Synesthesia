# Manifeste des runs utilisés pour les résultats du mémoire (chapitre 3).
#
# Pour chaque configuration de pondération (mémoire §2.3.3) :
#   - config      : fichier dans config/
#   - attr_alpha  : poids relatif des attributs continus dans la loss attributs (config 5 seulement)
#   - runs        : les 3 instances "Vide Sémantique" (couleur retirée des attributs)
#   - control     : le "Modèle Complet" de contrôle (couleur présente dans les attributs)
#
# `run_dir` = nom du dossier dans $GWT_RUNS_DIR (checkpoints/runs/ par défaut).
#   * Si vous ré-entraînez avec scripts/train_all.sh, les dossiers portent le nom
#     `<experiment>_seed<seed>` / `<experiment>_control`.
#   * `original_run_name` = nom du run d'origine (stage 2025), conservé pour la traçabilité
#     avec experiments/all_training_runs.csv et les poids publiés.
# `seed` = graine réellement enregistrée dans W&B pour ce run (voir all_training_runs.csv).
# `ckpt` = fichier de checkpoint évalué dans le mémoire.

experiments:
  base_params:
    config: base_params.yaml
    attr_alpha: 1
    runs:
      - {run_id: seed0, seed: 0, run_dir: base_params_seed0, ckpt: last.ckpt,
         original_run_name: "Base_params - corrected v5 (Logsoftmax --> exp --> log)"}
      - {run_id: seed1, seed: 1, run_dir: base_params_seed1, ckpt: last.ckpt,
         original_run_name: "(seed 1) Base_params - corrected v5 (Logsoftmax --> exp --> log)"}
      - {run_id: seed2, seed: 2, run_dir: base_params_seed2, ckpt: last.ckpt,
         original_run_name: "(seed 2) Base_params - corrected v5 (Logsoftmax --> exp --> log)"}
    control:
      {run_id: colored, seed: 0, run_dir: base_params_control, ckpt: last.ckpt,
       original_run_name: "(colored) Base_params - corrected v5 (Logsoftmax --> exp --> log)"}

  high_translation:
    config: high_translation.yaml
    attr_alpha: 1
    runs:
      - {run_id: seed0, seed: 0, run_dir: high_translation_seed0, ckpt: last.ckpt,
         original_run_name: "(Seed 0) (ter) High_translation (10) v5"}
      - {run_id: seed1, seed: 1, run_dir: high_translation_seed1, ckpt: last.ckpt,
         original_run_name: "(Seed 1) High_Translation (10) v5"}
      - {run_id: seed2, seed: 2, run_dir: high_translation_seed2, ckpt: last.ckpt,
         original_run_name: "(Seed 2) (ter) High_translation (10) v5"}
    control:
      {run_id: colored, seed: 0, run_dir: high_translation_control, ckpt: last.ckpt,
       original_run_name: "(Colored) H_T (10) v5"}

  high_contrastive:
    config: high_contrastive.yaml
    attr_alpha: 1
    runs:
      - {run_id: seed0, seed: 0, run_dir: high_contrastive_seed0, ckpt: last.ckpt,
         original_run_name: "(Seed 0) (bis) High_contrastive (10) v5"}
      - {run_id: seed1, seed: 1, run_dir: high_contrastive_seed1, ckpt: last.ckpt,
         original_run_name: "(Seed 1) (bis) High_contrastive (10) v5"}
      - {run_id: seed2, seed: 2, run_dir: high_contrastive_seed2, ckpt: last.ckpt,
         original_run_name: "(Seed 2) (bis) High_contrastive (10) v5"}
    control:
      {run_id: colored, seed: 2, run_dir: high_contrastive_control, ckpt: last.ckpt,
       original_run_name: "(Colored) High_contrastive (1) v5"}

  high_cycles:
    config: high_cycles.yaml
    attr_alpha: 1
    runs:
      - {run_id: seed0, seed: 0, run_dir: high_cycles_seed0, ckpt: last.ckpt,
         original_run_name: "(Seed 0) High_cycles (10) v5"}
      - {run_id: seed1, seed: 1, run_dir: high_cycles_seed1, ckpt: last.ckpt,
         original_run_name: "(Seed 1) (bis) High_cycles (10) v5"}
      - {run_id: seed2, seed: 2, run_dir: high_cycles_seed2, ckpt: last.ckpt,
         original_run_name: "(Seed 2) High_cycles (10) v5",
         original_ckpt: "epoch=1225.ckpt"}
    control:
      {run_id: colored, seed: 0, run_dir: high_cycles_control, ckpt: last.ckpt,
       original_run_name: "(colored) High_cycle (10) v5"}

  high_alpha:
    config: high_alpha.yaml
    attr_alpha: 5
    runs:
      # NB : dans les runs d'origine, les deux premières instances ont toutes deux
      # été lancées avec seed=1 (cf. all_training_runs.csv). Pour une réplication
      # propre, on utilise ici les graines 0, 1, 2.
      - {run_id: seed0, seed: 0, run_dir: high_alpha_seed0, ckpt: last.ckpt,
         original_run_name: "High alpha 5 (color) - corrected v5 (Logsoftmax --> exp --> log)",
         original_seed: 1}
      - {run_id: seed1, seed: 1, run_dir: high_alpha_seed1, ckpt: last.ckpt,
         original_run_name: "(seed 1) H_alpha (5) v5"}
      - {run_id: seed2, seed: 2, run_dir: high_alpha_seed2, ckpt: last.ckpt,
         original_run_name: "(seed 2) H_alpha (5) v5"}
    control:
      {run_id: colored, seed: 1, run_dir: high_alpha_control, ckpt: last.ckpt,
       original_run_name: "(Colored) H_alpha (5) v5"}
