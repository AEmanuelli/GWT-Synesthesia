# Manifeste des runs utilisés pour les résultats du mémoire (chapitre 3).
#
# Pour chaque configuration de pondération (mémoire §2.3.3) :
#   - config      : fichier dans config/
#   - attr_alpha  : poids relatif des attributs continus dans la loss attributs (config 5 seulement)
#   - runs        : les 3 instances "Vide Sémantique" (couleur retirée des attributs)
#   - control     : le "Modèle Complet" de contrôle (couleur présente dans les attributs)
#
# `run_dir` = nom du dossier dans $GWT_RUNS_DIR (checkpoints/runs/ par défaut).
#   * Si vous ré-entraînez avec scripts/train_all.sh, les dossiers portent le nom
#     `<experiment>_seed<seed>` / `<experiment>_control`.
#   * `original_run_name` = nom du run d'origine (stage 2025), conservé pour la traçabilité
#     avec experiments/all_training_runs.csv et les poids publiés.
# `seed` = graine réellement enregistrée dans W&B pour ce run (voir all_training_runs.csv).
# `ckpt` = fichier de checkpoint évalué dans le mémoire.
# `expect` = empreinte du checkpoint d'origine (epoch, pas, coefficients de loss,
#   couleur dans les attributs, durée du planning de LR), relevée dans les fichiers
#   eux-mêmes. scripts/identify_checkpoints.py s'en sert pour retrouver les fichiers.
# Vérification : les losses de validation de ces runs reproduisent le tableau B.1 du mémoire
#   (experiments/compute_table_B1.py à partir des checkpoints, check_table_B1.py à partir
#   d'un export W&B ; voir README §5).

experiments:
  base_params:
    config: base_params.yaml
    attr_alpha: 1
    runs:
      - {run_id: seed0, seed: 0, run_dir: base_params_seed0, ckpt: last.ckpt,
         original_run_name: "Base_params - corrected v5 (Logsoftmax --> exp --> log)",
         expect: {epoch: 1233, global_step: 299862, loss_coefs: {translations: 1, contrastives: 0.1, demi_cycles: 1, cycles: 1}, colors_in_attr: false, total_steps: 300000}}
      - {run_id: seed1, seed: 1, run_dir: base_params_seed1, ckpt: last.ckpt,
         original_run_name: "(seed 1) Base_params - corrected v5 (Logsoftmax --> exp --> log)",
         expect: {epoch: 849, global_step: 206550, loss_coefs: {translations: 1, contrastives: 0.1, demi_cycles: 1, cycles: 1}, colors_in_attr: false, total_steps: 300000}}
      - {run_id: seed2, seed: 2, run_dir: base_params_seed2, ckpt: last.ckpt,
         original_run_name: "(seed 2) Base_params - corrected v5 (Logsoftmax --> exp --> log)",
         expect: {epoch: 1231, global_step: 299376, loss_coefs: {translations: 1, contrastives: 0.1, demi_cycles: 1, cycles: 1}, colors_in_attr: false, total_steps: 300000}}
    control:
      {run_id: colored, seed: 0, run_dir: base_params_control, ckpt: last.ckpt,
       original_run_name: "(colored) Base_params - corrected v5 (Logsoftmax --> exp --> log)",
       expect: {epoch: 871, global_step: 211896, loss_coefs: {translations: 1, contrastives: 0.1, demi_cycles: 1, cycles: 1}, colors_in_attr: true, total_steps: 300000}}

  high_translation:
    config: high_translation.yaml
    attr_alpha: 1
    runs:
      - {run_id: seed0, seed: 0, run_dir: high_translation_seed0, ckpt: last.ckpt,
         original_run_name: "(Seed 0) (ter) High_translation (10) v5",
         expect: {epoch: 1167, global_step: 283824, loss_coefs: {translations: 10, contrastives: 0.1, demi_cycles: 1, cycles: 1}, colors_in_attr: false, total_steps: 300000}}
      - {run_id: seed1, seed: 1, run_dir: high_translation_seed1, ckpt: last.ckpt,
         original_run_name: "(Seed 1) High_Translation (10) v5",
         expect: {epoch: 888, global_step: 216027, loss_coefs: {translations: 10, contrastives: 0.1, demi_cycles: 1, cycles: 1}, colors_in_attr: false, total_steps: 300000}}
      - {run_id: seed2, seed: 2, run_dir: high_translation_seed2, ckpt: last.ckpt,
         original_run_name: "(Seed 2) (ter) High_translation (10) v5",
         expect: {epoch: 948, global_step: 230607, loss_coefs: {translations: 10, contrastives: 0.1, demi_cycles: 1, cycles: 1}, colors_in_attr: false, total_steps: 300000}}
    control:
      {run_id: colored, seed: 0, run_dir: high_translation_control, ckpt: last.ckpt,
       original_run_name: "(Colored) H_T (10) v5",
       expect: {epoch: 1233, global_step: 299862, loss_coefs: {translations: 10, contrastives: 0.1, demi_cycles: 1, cycles: 1}, colors_in_attr: true, total_steps: 300000}}

  high_contrastive:
    config: high_contrastive.yaml
    attr_alpha: 1
    runs:
      - {run_id: seed0, seed: 0, run_dir: high_contrastive_seed0, ckpt: last.ckpt,
         original_run_name: "(Seed 0) (bis) High_contrastive (10) v5",
         expect: {epoch: 1231, global_step: 299376, loss_coefs: {translations: 1, contrastives: 1, demi_cycles: 1, cycles: 1}, colors_in_attr: false, total_steps: 300000}}
      - {run_id: seed1, seed: 1, run_dir: high_contrastive_seed1, ckpt: last.ckpt,
         original_run_name: "(Seed 1) (bis) High_contrastive (10) v5",
         expect: {epoch: 1224, global_step: 297675, loss_coefs: {translations: 1, contrastives: 1, demi_cycles: 1, cycles: 1}, colors_in_attr: false, total_steps: 300000}}
      - {run_id: seed2, seed: 2, run_dir: high_contrastive_seed2, ckpt: last.ckpt,
         original_run_name: "(Seed 2) (bis) High_contrastive (10) v5",
         expect: {epoch: 1224, global_step: 297675, loss_coefs: {translations: 1, contrastives: 1, demi_cycles: 1, cycles: 1}, colors_in_attr: false, total_steps: 300000}}
    control:
      {run_id: colored, seed: 2, run_dir: high_contrastive_control, ckpt: last.ckpt,
       original_run_name: "(Colored) High_contrastive (1) v5",
       # Le dossier contient 2 lancements : epoch=605 (run W&B 060a6i4a, celui du tableau B.1)
       # et une relance avortée epoch=46 (last.ckpt). On prend le premier.
       original_ckpt: "epoch=605.ckpt", wandb_run_id: 060a6i4a,
       expect: {epoch: 605, global_step: 147258, loss_coefs: {translations: 1, contrastives: 1, demi_cycles: 1, cycles: 1}, colors_in_attr: true, total_steps: 150000}}

  high_cycles:
    config: high_cycles.yaml
    attr_alpha: 1
    runs:
      - {run_id: seed0, seed: 0, run_dir: high_cycles_seed0, ckpt: last.ckpt,
         original_run_name: "(Seed 0) High_cycles (10) v5",
         expect: {epoch: 1214, global_step: 295245, loss_coefs: {translations: 1, contrastives: 0.1, demi_cycles: 1, cycles: 10}, colors_in_attr: false, total_steps: 300000}}
      - {run_id: seed1, seed: 1, run_dir: high_cycles_seed1, ckpt: last.ckpt,
         original_run_name: "(Seed 1) (bis) High_cycles (10) v5",
         expect: {epoch: 1222, global_step: 297189, loss_coefs: {translations: 1, contrastives: 0.1, demi_cycles: 1, cycles: 10}, colors_in_attr: false, total_steps: 300000}}
      - {run_id: seed2, seed: 2, run_dir: high_cycles_seed2, ckpt: last.ckpt,
         original_run_name: "(Seed 2) High_cycles (10) v5",
         original_ckpt: "epoch=1225.ckpt",
         expect: {epoch: 1225, global_step: 297918, loss_coefs: {translations: 1, contrastives: 0.1, demi_cycles: 1, cycles: 10}, colors_in_attr: false, total_steps: 300000}}
    control:
      {run_id: colored, seed: 0, run_dir: high_cycles_control, ckpt: last.ckpt,
       original_run_name: "(colored) High_cycle (10) v5",
       expect: {epoch: 616, global_step: 149931, loss_coefs: {translations: 1, contrastives: 0.1, demi_cycles: 1, cycles: 10}, colors_in_attr: true, total_steps: 150000}}

  high_alpha:
    config: high_alpha.yaml
    attr_alpha: 5
    runs:
      # NB : dans les runs d'origine, les deux premières instances ont toutes deux
      # été lancées avec seed=1 (cf. all_training_runs.csv). Pour une réplication
      # propre, on utilise ici les graines 0, 1, 2.
      - {run_id: seed0, seed: 0, run_dir: high_alpha_seed0, ckpt: last.ckpt,
         original_run_name: "High alpha 5 (color) - corrected v5 (Logsoftmax --> exp --> log)",
         wandb_name: "High alpha 5 - corrected v5 (Logsoftmax --> exp --> log)",
         original_seed: 1,
         expect: {epoch: 1230, global_step: 299133, loss_coefs: {translations: 1, contrastives: 0.1, demi_cycles: 1, cycles: 1}, colors_in_attr: false, total_steps: 300000}}
      - {run_id: seed1, seed: 1, run_dir: high_alpha_seed1, ckpt: last.ckpt,
         original_run_name: "(seed 1) H_alpha (5) v5",
         expect: {epoch: 1209, global_step: 294030, loss_coefs: {translations: 1, contrastives: 0.1, demi_cycles: 1, cycles: 1}, colors_in_attr: false, total_steps: 300000}}
      - {run_id: seed2, seed: 2, run_dir: high_alpha_seed2, ckpt: last.ckpt,
         original_run_name: "(seed 2) H_alpha (5) v5",
         expect: {epoch: 1211, global_step: 294516, loss_coefs: {translations: 1, contrastives: 0.1, demi_cycles: 1, cycles: 1}, colors_in_attr: false, total_steps: 300000}}
    control:
      {run_id: colored, seed: 1, run_dir: high_alpha_control, ckpt: last.ckpt,
       original_run_name: "(Colored) H_alpha (5) v5",
       expect: {epoch: 1208, global_step: 293787, loss_coefs: {translations: 1, contrastives: 0.1, demi_cycles: 1, cycles: 1}, colors_in_attr: true, total_steps: 300000}}
