# Configuration commune à toutes les expériences.
# Les chemins ci-dessous sont des valeurs par défaut : SSD_Train.py les remplace
# par ceux de SSD_eval/paths.py (surchargeables par variables d'environnement).
# Pour des réglages propres à votre machine, créez config/local.yaml (ignoré par git).

# Où sauvegarder les checkpoints
default_root_dir: "./checkpoints/runs"

dataset:
    # Chemin vers le Simple Shapes Dataset
    path: "./data/simple_shapes_dataset"

wandb:
    # Le logging W&B est optionnel : SSD_Train.py passe en mode "offline"
    # si la variable d'environnement WANDB_API_KEY n'est pas définie.
    # NE JAMAIS écrire de clé API dans ce fichier.
    enabled: false
    save_dir: "./wandb"
    project: "gwt-synesthesia"

# Groupes de domaines utilisés à chaque pas d'entraînement
domain_proportions:
    -   domains: ["attr"]
        proportion: 1.0
    -   domains: ["v"]
        proportion: 1.0
    -   domains: ["v", "attr"]
        proportion: 1.0
