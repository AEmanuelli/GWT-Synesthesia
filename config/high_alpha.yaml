# Configuration 5 (Emphase Attributs Continus) : (α=1, β=0.1, γ=1, δ=1) + poids x5 sur les attributs continus (--attr-alpha 5)
# Coefficients des losses (mémoire §2.3.3) :
#   translations = alpha, contrastives = beta, demi_cycles = gamma, cycles = delta
global_workspace:
    latent_dim: 12
    loss_coefficients:
        translations: 1
        contrastives: 0.1
        demi_cycles: 1
        cycles: 1
    encoders:
        hidden_dim: 256
        n_layers: 2
    decoders:
        hidden_dim: 256
        n_layers: 2

training:
    batch_size: 2056
    optim:
        lr: 1e-5
        weight_decay: 1e-6
        max_lr: 1.5e-4
        start_lr: 1e-4
        end_lr: 1e-5
        pct_start: 0.03
    max_steps: 300000
    devices: 1

logging:
    log_val_medias_every_n_epochs: 1
    log_train_medias_every_n_epochs: 5
    filter_images:
        - pred_trans_attr_to_attr
        - pred_trans_v_latents_to_v_latents
        - pred_trans_attr_to_v_latents
        - pred_trans_v_latents_to_attr
        - pred_cycle_v_latents_to_attr
        - pred_cycle_attr_to_v_latents
        - pred_cycle_v_latents_to_v_latents
        - pred_cycle_attr_to_attr

domain_data_args:
    v_latents:
        # Latents du VAE visuel pré-calculés : <dataset>/saved_latents/<split>/vae_v_shimmer.npy
        # (voir README, étape "Pré-calculer les latents visuels")
        presaved_path: vae_v_shimmer.npy
    attr:
        n_unpaired: 0
